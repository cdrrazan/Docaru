# Self-hosting, the short version:
#
#   cp .env.example .env && $EDITOR .env     # generate the secrets
#   docker compose up -d --build
#
# Two services: the application and a MySQL server. The application is still a
# single process — Solid Queue runs inside Puma, so the nightly reminder sweep
# cannot be the thing an operator forgets to start. That sweep is the product.

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD:?set DATABASE_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DATABASE_NAME:-docaru_production}
      MYSQL_USER: ${DATABASE_USERNAME:-docaru}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - docaru-db:/var/lib/mysql
      # Grants the app user rights over the cache, queue and cable databases as
      # well as its own. MYSQL_USER alone is only scoped to MYSQL_DATABASE, so
      # without this the first boot fails creating the Solid Queue database.
      - ./deploy/mysql-init.sql:/docker-entrypoint-initdb.d/10-docaru.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DATABASE_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  docaru:
    build:
      context: .
    image: docaru
    restart: unless-stopped
    depends_on:
      db:
        # The entrypoint runs db:prepare, so starting before MySQL is ready is
        # a crash loop rather than a wait.
        condition: service_healthy
    ports:
      - "${PORT:-8080}:80"
    env_file:
      - .env
    environment:
      DATABASE_HOST: db
    volumes:
      # Encrypted attachments only — the databases live in the db service now.
      # Both volumes need backing up, and neither is useful without the other.
      - docaru-storage:/rails/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  docaru-db:
  docaru-storage:
