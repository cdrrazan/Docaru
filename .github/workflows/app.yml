name: App

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The Rails app lives in web/ because rules/ is the public artefact and has to
# stay at the top of the repository where a contributor correcting a renewal
# date will actually find it.
defaults:
  run:
    working-directory: web

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: docaru
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      # mysql2 is a native extension and needs the client headers to build.
      - name: Install MySQL client library
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libmysqlclient-dev

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: web

      - name: Run tests
        env:
          RAILS_ENV: test
          # root, because the suite creates a database per parallel worker plus
          # the separate cache, queue and cable databases — more than a scoped
          # user is granted. Fine for a throwaway CI container.
          DATABASE_USERNAME: root
          DATABASE_PASSWORD: docaru
          DATABASE_HOST: 127.0.0.1
        run: bin/rails db:test:prepare test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # mysql2 is a native extension; bundle install needs the client headers.
      - name: Install MySQL client library
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libmysqlclient-dev

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: web

      - name: Lint
        run: bin/rubocop -f github

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # mysql2 is a native extension; bundle install needs the client headers.
      - name: Install MySQL client library
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libmysqlclient-dev

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: web

      - name: Static analysis
        run: bin/brakeman --no-pager

      - name: Audit gems
        run: bin/bundler-audit

      - name: Audit JavaScript pins
        run: bin/importmap audit
