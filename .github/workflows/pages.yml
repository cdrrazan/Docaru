name: Publish playbooks

# Manual until GitHub Pages is turned on for this repository
# (Settings > Pages > Source: GitHub Actions). Note that Pages on a private
# repository needs a paid plan; making the repo public is the other route, and
# is the one the spec's open-dataset positioning points at anyway.
#
# Once Pages is enabled, add the push trigger back so every merge republishes:
#
#   push:
#     branches: [main]
#
# It is left off deliberately rather than left failing: a workflow that is red
# on every push teaches people to ignore red builds, and the staleness and
# feasibility checks in this repo are only worth having if a red build still
# means something.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false

      # Nothing gets published that has not passed validation first. A wrong
      # renewal date is worse than no page at all.
      - name: Validate before publishing
        run: ruby bin/validate --max-age-days 365

      - name: Build
        run: ruby bin/build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - id: deploy
        uses: actions/deploy-pages@v4
