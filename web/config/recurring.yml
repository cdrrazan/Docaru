# The reminder sweep is the product. If this stops running, the application
# still renders perfectly and delivers nothing of value.
#
# It runs daily rather than hourly because every deadline here is a date, not a
# time — and it is idempotent, so a missed night is caught up by the next run
# rather than lost.
defaults: &defaults
  deliver_reminders:
    class: DeliverRemindersJob
    queue: default
    schedule: every day at 7am

development:
  <<: *defaults

production:
  <<: *defaults

  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
